name = "yldfi-cache"
main = "vault-cache.ts"
compatibility_date = "2026-09-02"
compatibility_flags = ["no_nodejs_compat", "no_nodejs_compat_v2"]

# NOTE: Workers on the Free plan are limited to 50 external subrequests per invocation
# (and 1,000 to Cloudflare services); this cannot be raised on Free. The `[limits]`
# block used to set `subrequest_limit`, which is not a valid key and was silently
# ignored. Keep any backfill work chunked to stay under 50 external calls per invocation.

[triggers]
# Every 5 minutes: vault cache. Every 15 minutes: archive history (must match
# HISTORY_CRON in vault-cache.ts; separate invocations get separate budgets).
crons = ["*/5 * * * *", "2,17,32,47 * * * *"]

[[kv_namespaces]]
binding = "VAULT_CACHE"
id = "196d1aceae10469bb4bde0495b3e3ae0"

[[d1_databases]]
binding = "LOGS"
database_name = "yldfi-logs"
database_id = "b2f2df39-1663-4507-8e58-5a21c4b14770"

[[r2_buckets]]
binding = "HISTORY"
bucket_name = "yldfi-history"
preview_bucket_name = "yldfi-history"

[[secrets_store_secrets]]
binding = "RPC_URL"
store_id = "be7efaed4f394d5a96abab0ed1da9979"
secret_name = "MUUPE_RPC_URL"

name = "yldfi-x-weekly-apy"
main = "x-weekly-apy.ts"
compatibility_date = "2026-09-02"
compatibility_flags = ["no_nodejs_compat", "no_nodejs_compat_v2"]

# Reachable only on its own custom domain, with no workers.dev or preview address.
# The OAuth callback registered with X must be https://x-bot.yldfi.co/oauth/callback
# (the worker derives its redirect URI from the request URL).
workers_dev = false
preview_urls = false
routes = [{ pattern = "x-bot.yldfi.co", custom_domain = true }]

[vars]
CLOUDFLARE_ACCOUNT_ID = "7f4f33bd3b9086164518eee1e9b8590a"
SITE_URL = "https://yldfi.co"
SOCIAL_RENDER_PATH = "/social/weekly-apy"
X_WEEKLY_COPY = "Weekly yld vault yields are here\n\nAuto-compounding strategies for cvxCRV and CVX.\n\nyldfi.co"
X_DRY_RUN = "false"

[triggers]
crons = ["0 10 * * MON"]

[[kv_namespaces]]
binding = "SOCIAL_CACHE"
id = "0f7a04f586dc44b5b6c8be46946482d3"

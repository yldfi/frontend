name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run integration tests nightly at 2am UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: "Run integration tests"
        required: false
        default: "false"
        type: boolean

env:
  NODE_VERSION: "24"

# One run per ref: a new push supersedes the previous one instead of queueing
# behind a deploy that will be overwritten anyway.
concurrency:
  # Include the event so the nightly run never cancels an in-flight main deploy.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: none

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  audit-changes:
    name: Audit Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deps: ${{ steps.diff.outputs.deps }}
    steps:
      - name: Detect dependency changes
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # If the file list can't be read (e.g. a very large diff), audit anyway.
          if ! files=$(gh pr diff "$PR" --repo "$REPO" --name-only); then
            echo "deps=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pattern='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|\.github/workflows/ci\.yml)$'
          if printf '%s\n' "$files" | grep -qE "$pattern"; then deps=true; else deps=false; fi
          echo "Dependency files changed: $deps"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"

  audit:
    name: Dependency Audit
    # Required check, but only blocking on PRs that change dependencies: on
    # other PRs it is skipped (a skipped required check counts as passing).
    # Not a deploy prerequisite: a newly published advisory should flag main
    # and the nightly run, not block an unrelated production deploy.
    needs: audit-changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.audit-changes.result != 'success' || needs.audit-changes.outputs.deps == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit the full dependency tree
        # Ignored advisories (no fixed release yet) live in pnpm-workspace.yaml.
        run: pnpm audit --audit-level=high

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm type-check

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Replay vault cache worker failure handling
        run: node workers/testing/replay-vault-cache.mjs

      - name: Replay archive history runtime
        run: node workers/testing/replay-vault-history.mjs

      - name: Run unit tests with coverage
        run: pnpm test:unit --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Run nightly (2am UTC) or on manual trigger only - not on every push.
    # This is not a PR check, so a red nightly run does not block merges or
    # deploys: keep it honest instead of hiding failures behind
    # continue-on-error. Suites that need an external endpoint they cannot
    # reach (simulation RPC, Enso API key) skip loudly rather than fail.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests (with retry)
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            pnpm test:integration && break || {
              if [ $i -eq 3 ]; then
                echo "Integration tests failed after 3 attempts"
                exit 1
              fi
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done
        env:
          ENSO_API_KEY: ${{ secrets.ENSO_API_KEY }}
          TOKEN_HOLDER_API_KEY: ${{ secrets.TOKEN_HOLDER_API_KEY }}
          TOKEN_HOLDER_API_URL: ${{ secrets.TOKEN_HOLDER_API_URL }}
          DEBUG_RPC_URL: ${{ secrets.DEBUG_RPC_URL }}
          DEBUG_RPC_AUTH: ${{ secrets.DEBUG_RPC_AUTH }}

      - name: Upload integration test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results
          path: |
            coverage/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-unit]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm test:e2e:install

      - name: Build application
        run: pnpm build
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-unit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare
        run: pnpm build:cloudflare
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          # Server-side secrets (ENSO_API_KEY, TOKEN_HOLDER_API_KEY, ETHERSCAN_API_KEY, etc.)
          # are configured as Cloudflare Worker secrets, not at build time

      - name: Populate static assets cache
        run: pnpm populate:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  deploy-cache-worker:
    name: Deploy cache worker to Cloudflare
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-unit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy cache worker to Cloudflare
        run: npx wrangler deploy --config ./workers/wrangler.toml
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

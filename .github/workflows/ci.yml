name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "24"

# One run per ref: a new push supersedes the previous one instead of queueing
# behind a deploy that will be overwritten anyway.
concurrency:
  # Include the event so the nightly run never cancels an in-flight main deploy.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: none

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  audit-changes:
    name: Audit Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deps: ${{ steps.diff.outputs.deps }}
    steps:
      - name: Detect dependency changes
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # If the file list can't be read (e.g. a very large diff), audit anyway.
          if ! files=$(gh pr diff "$PR" --repo "$REPO" --name-only); then
            echo "deps=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          pattern='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|\.github/workflows/ci\.yml)$'
          if printf '%s\n' "$files" | grep -qE "$pattern"; then deps=true; else deps=false; fi
          echo "Dependency files changed: $deps"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"

  audit:
    name: Dependency Audit
    # Required check, but only blocking on PRs that change dependencies: on
    # other PRs it is skipped (a skipped required check counts as passing).
    # Not a deploy prerequisite: a newly published advisory should flag main
    # and the nightly run, not block an unrelated production deploy.
    needs: audit-changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.audit-changes.result != 'success' || needs.audit-changes.outputs.deps == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit the full dependency tree
        # Ignored advisories (no fixed release yet) live in pnpm-workspace.yaml.
        run: pnpm audit --audit-level=high

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm type-check

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Replay vault cache worker failure handling
        run: node workers/testing/replay-vault-cache.mjs

      - name: Replay archive history runtime
        run: node workers/testing/replay-vault-history.mjs

      - name: Run unit tests with coverage
        run: pnpm test:unit --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  test-sweep:
    name: Bundle Delivery Sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ~2,700 intent-route builds in one file: serialising it made the unit gate
      # ~3 minutes. Each shard is its own vitest process, so the work spreads
      # across the runner's cores while staying one source file.
      - name: Run sweep in parallel shards
        run: |
          for i in 0 1 2 3; do
            SWEEP_PART="$i" SWEEP_TOTAL=4 pnpm test:sweep >"/tmp/sweep-$i.log" 2>&1 &
          done
          status=0
          for pid in $(jobs -p); do wait "$pid" || status=1; done
          for i in 0 1 2 3; do
            echo "::group::sweep shard $i"
            cat "/tmp/sweep-$i.log"
            echo "::endgroup::"
          done
          exit "$status"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-unit]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm test:e2e:install

      # Webpack's persistent cache: the compile is ~36s of the build on CI.
      # Measured before this step: build job 118s (cold, no cache available).
      - name: Restore Next build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build application
        run: pnpm build
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  build-cloudflare:
    name: Build for Cloudflare
    runs-on: ubuntu-latest
    # Runs in parallel with the test jobs instead of after them, so the ~2m
    # OpenNext build is not added to the test gate's critical path. Not a gate:
    # `deploy` still waits for lint/type-check/test-unit before uploading.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Webpack's persistent cache: the compile is ~36s of the build on CI.
      - name: Restore Next build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build for Cloudflare
        run: pnpm build:cloudflare
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          # Server-side secrets (ENSO_API_KEY, TOKEN_HOLDER_API_KEY, ETHERSCAN_API_KEY, etc.)
          # are configured as Cloudflare Worker secrets, not at build time

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: opennext-build
          path: .open-next
          # .open-next starts with a dot, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-unit, test-sweep, build-cloudflare]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build already happened in build-cloudflare; only the gate (tests)
      # was still running. Restore the output instead of rebuilding.
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: opennext-build
          path: .open-next

      - name: Verify downloaded build output
        run: |
          # Fail with a clear message rather than a confusing wrangler error if
          # the artifact layout ever changes.
          test -f .open-next/worker.js
          test -d .open-next/assets

      - name: Populate static assets cache
        run: pnpm populate:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  deploy-cache-worker:
    name: Deploy cache worker to Cloudflare
    runs-on: ubuntu-latest
    needs: [lint, type-check, test-unit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy cache worker to Cloudflare
        run: npx wrangler deploy --config ./workers/wrangler.toml
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

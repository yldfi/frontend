name: Nightly

# Integration tests only. They talk to live upstreams (Enso routing, the archive
# RPC, token-holder APIs) and are not a PR check, so they live in their own
# workflow: separate run history, separate concurrency, and a red night is
# visible on its own rather than buried in the CI/CD run.
#
# GitHub runs scheduled workflows best-effort on the default branch; the 2am UTC
# cron typically lands around 07:00 UTC.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Suites that need an external endpoint they cannot reach (simulation RPC,
    # Enso API key) skip loudly rather than fail.
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests (with retry)
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3..."
            pnpm test:integration && break || {
              if [ $i -eq 3 ]; then
                echo "Integration tests failed after 3 attempts"
                exit 1
              fi
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            }
          done
        env:
          ENSO_API_KEY: ${{ secrets.ENSO_API_KEY }}
          TOKEN_HOLDER_API_KEY: ${{ secrets.TOKEN_HOLDER_API_KEY }}
          TOKEN_HOLDER_API_URL: ${{ secrets.TOKEN_HOLDER_API_URL }}
          DEBUG_RPC_URL: ${{ secrets.DEBUG_RPC_URL }}
          DEBUG_RPC_AUTH: ${{ secrets.DEBUG_RPC_AUTH }}

      - name: Upload integration test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results
          path: |
            coverage/
          retention-days: 7


name: Nightly

# Integration tests and the dependency audit. The tests talk to live upstreams
# (Enso routing, the archive RPC, token-holder APIs) and are not a PR check, so
# they live in their own workflow: separate run history, separate concurrency,
# and a red night is visible on its own rather than buried in the CI/CD run.
# The audit job needs no secrets: it reads the lockfile only.
#
# GitHub runs scheduled workflows best-effort on the default branch; the 2am UTC
# cron typically lands around 07:00 UTC.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  audit:
    name: Dependency Audit
    # Catches advisories published against the current lockfile on days with no
    # push to main. Not a gate: nothing depends on this job.
    # Ignored advisories (no fixed release yet) live in pnpm-workspace.yaml.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit the full dependency tree
        run: pnpm audit --audit-level=high

  test-integration:
    name: Integration Tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Suites that need an external endpoint they cannot reach (simulation RPC,
    # Enso API key) skip loudly rather than fail.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Per-test retry (vitest.config.ts, integration project: retry 1) is the
      # only retry layer. A whole-suite loop re-ran every passing live suite
      # and spent paid upstream calls.
      - name: Run integration tests
        run: pnpm test:integration
        env:
          ENSO_API_KEY: ${{ secrets.ENSO_API_KEY }}
          TOKEN_HOLDER_API_KEY: ${{ secrets.TOKEN_HOLDER_API_KEY }}
          TOKEN_HOLDER_API_URL: ${{ secrets.TOKEN_HOLDER_API_URL }}
          DEBUG_RPC_URL: ${{ secrets.DEBUG_RPC_URL }}
          DEBUG_RPC_AUTH: ${{ secrets.DEBUG_RPC_AUTH }}

      - name: Upload integration test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-test-results
          path: |
            coverage/
          retention-days: 7


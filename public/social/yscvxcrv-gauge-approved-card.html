<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>yscvxCRV/CRV Gauge Approved Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./ycvxcrv-promo.css" />
    <style>
      .pair-icons {
        display: flex;
        margin-bottom: 26px;
      }

      .side-note {
        top: 150px;
      }

      .side-note .pair-icons img {
        width: 104px;
        height: 104px;
        margin-bottom: 0;
        border-radius: 50%;
        box-shadow: 0 0 0 5px var(--background);
      }

      .side-note .pair-icons img + img {
        margin-left: -18px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <section class="hero">
        <p class="eyebrow">[0x] Governance</p>
        <h1>
          <span>Curve</span>
          <em>gauge</em>
          <span>approved.</span>
        </h1>
      </section>

      <aside class="side-note">
        <div class="pair-icons">
          <img src="../yscvxcrv-200.png" alt="" />
          <img src="../tokens/crv.png" alt="" />
        </div>
        <strong>yscvxCRV/CRV</strong>
        <p>Now on the Curve Gauge Controller. CRV emissions start 26 Nov.</p>
      </aside>

      <footer class="bottomline">
        <div class="brand-lockup">
          <img src="../logo-128.png" alt="" />
          <div>
            <span class="brand-word">yld</span>
            <span class="brand-tagline">Automated yield optimization</span>
          </div>
        </div>
        <strong>yldfi.co</strong>
      </footer>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>ycvxCRV LlamaLend Sunset Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --background: #09090b;
        --foreground: #fafafa;
        --muted: #a1a1aa;
        --border: #3f3f46;
        --panel: rgba(24, 24, 27, 0.86);
        --accent: #f59e0b;
      }

      html,
      body {
        width: 1200px;
        height: 675px;
        margin: 0;
        overflow: hidden;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 675px;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(9, 9, 11, 0.9), rgba(9, 9, 11, 0.64) 52%, rgba(9, 9, 11, 0.42)),
          url("./hero-network-bg.png"),
          var(--background);
        background-position: center;
        background-size: cover;
      }

      .card::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 5px;
        background: linear-gradient(90deg, #f59e0b, #ef4444, #22c55e, #06b6d4, #3b82f6);
      }

      .topline,
      .bottomline {
        position: absolute;
        z-index: 5;
        right: 64px;
        left: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .topline {
        top: 54px;
      }

      .bottomline {
        bottom: 42px;
        justify-content: flex-end;
        color: var(--muted);
        font-size: 18px;
        line-height: 1;
      }

      .bottomline strong {
        color: var(--foreground);
        font-weight: 500;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-lockup img {
        width: 58px;
        height: 58px;
      }

      .brand-word,
      .mono {
        font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      }

      .brand-word {
        display: block;
        color: var(--foreground);
        font-size: 28px;
        line-height: 1;
        font-weight: 500;
        letter-spacing: 0;
      }

      .brand-tagline {
        display: block;
        margin-top: 9px;
        color: var(--muted);
        font-size: 20px;
        line-height: 1;
        font-weight: 400;
        letter-spacing: 0;
      }

      .hero {
        position: absolute;
        z-index: 2;
        top: 198px;
        left: 64px;
        width: 650px;
      }

      h1 {
        margin: 0;
        color: var(--foreground);
        font-size: 88px;
        line-height: 0.98;
        font-weight: 500;
        letter-spacing: 0;
      }

      h1 span,
      h1 em {
        display: block;
        font-style: normal;
      }

      h1 em {
        color: var(--accent);
      }

      h1 .period {
        display: inline;
        color: var(--foreground);
      }

      .support {
        margin: 28px 0 0;
        max-width: 580px;
        color: var(--muted);
        font-size: 27px;
        line-height: 1.25;
        font-weight: 400;
        letter-spacing: 0;
      }

      .logo-feature {
        position: absolute;
        z-index: 3;
        top: 206px;
        right: 176px;
        width: 280px;
        text-align: center;
      }

      .logo-feature img {
        width: 260px;
        height: 260px;
        filter: drop-shadow(0 30px 70px rgba(0, 0, 0, 0.58));
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header class="topline">
        <div class="brand-lockup">
          <img src="../logo-128.png" alt="" />
          <div>
            <span class="brand-word">yld</span>
            <span class="brand-tagline">Automated yield optimization</span>
          </div>
        </div>
      </header>

      <section class="hero">
        <h1>
          <span>ycvxCRV is</span>
          <em>sunsetting<span class="period">.</span></em>
        </h1>
        <p class="support">Following the Curve DAO decision to sunset ycvxCRV collateral on LlamaLend v1.</p>
      </section>

      <aside class="logo-feature">
        <img src="../ycvxcrv-128.png" alt="" />
      </aside>

      <footer class="bottomline">
        <strong>yldfi.co</strong>
      </footer>
    </main>
  </body>
</html>
